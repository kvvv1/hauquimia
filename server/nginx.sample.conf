# Sample reverse-proxy config for the VPS. Adjust the domain and run
# certbot to provision HTTPS (Let's Encrypt) before pointing the front-end
# at this host — the Netlify front-end is HTTPS and cannot call an HTTP API.
#
#   sudo certbot --nginx -d api.hauquimia.com.br
#
server {
    listen 80;
    server_name api.hauquimia.com.br;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
